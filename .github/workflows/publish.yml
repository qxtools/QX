name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      unlist:
        description: "Package versions to unlist, separated by spaces. Leave empty to verify NuGet authentication."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: nuget-publish
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
      - name: Verify release version
        if: github.event_name == 'push'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = ([xml](Get-Content Framework.props -Raw)).Project.PropertyGroup.QxFrameworkVersion | Where-Object { $_ }
          if ($env:GITHUB_REF -ne "refs/tags/v$version") { throw 'The release tag must match QxFrameworkVersion.' }
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'Release commits must belong to main.' }
      - name: Verify message facade
        if: github.event_name == 'push'
        shell: pwsh
        run: ./tools/generate-message-facade.ps1 -check
      - name: Build packages
        if: github.event_name == 'push'
        shell: pwsh
        run: ./tools/pack-framework.ps1
      - name: Verify maintenance branch
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'Package maintenance must run from main.' }
      - name: Authenticate to NuGet
        id: login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841
        with:
          user: QDave
      - name: Publish packages
        if: github.event_name == 'push'
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($package in Get-ChildItem artifacts/framework -Filter '*.nupkg' | Sort-Object Name) {
            dotnet nuget push $package.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "Publishing $($package.Name) failed." }
          }
      - name: Unlist package versions
        if: github.event_name == 'workflow_dispatch' && inputs.unlist != ''
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSIONS: ${{ inputs.unlist }}
        run: |
          $ErrorActionPreference = 'Stop'
          $versions = @($env:PACKAGE_VERSIONS.Trim() -split '\s+')
          foreach ($entry in $versions) {
            if ($entry -notmatch '^QX(?:\.[A-Za-z0-9]+)*@\d+\.\d+\.\d+(?:-[A-Za-z0-9.-]+)?$') {
              throw "Invalid QX package version: $entry"
            }
          }
          foreach ($entry in $versions) {
            $package, $version = $entry -split '@', 2
            dotnet nuget delete $package $version --non-interactive --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json
            if ($LASTEXITCODE -ne 0) { throw "Unlisting $entry failed." }
          }

  release:
    if: github.event_name == 'push'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json tagName >/dev/null 2>&1; then
            exit 0
          fi
          previous_tag=$(git describe --tags --abbrev=0 "${GITHUB_SHA}^" 2>/dev/null || true)
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$GITHUB_SHA"
          else
            range="$GITHUB_SHA"
          fi
          git log --first-parent --reverse --format=%s "$range" > "$RUNNER_TEMP/release-notes.txt"
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "${GITHUB_REF_NAME#v}" --notes-file "$RUNNER_TEMP/release-notes.txt"
