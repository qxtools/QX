name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "website/**"
      - "global.json"
      - "Directory.Build.*"
      - "Framework.props"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_NOLOGO: "1"
  NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages

jobs:
  publish:
    name: Publish docs bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68
        with:
          global-json-file: global.json
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Prepare framework packages
        shell: pwsh
        run: ./tools/pack-framework.ps1

      - name: Restore solution
        run: dotnet restore QX.Framework.slnx --locked-mode --disable-build-servers

      - name: Install DocFX
        run: dotnet tool install --global docfx --version 2.81.0

      - name: Generate API metadata
        run: docfx metadata website/docfx.json

      - name: Build docs bundle
        working-directory: website
        run: |
          npm ci
          npm run bundle -- --out ../artifacts/docs

      - name: Compare with published docs
        id: compare
        run: |
          current=$(jq -r .hash artifacts/docs/manifest.json)
          published=""
          if git fetch --quiet origin docs; then
            published=$(git show FETCH_HEAD:manifest.json | jq -r .hash)
          fi
          if [ "$current" = "$published" ]; then
            echo "Docs are unchanged, nothing to publish."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to docs branch
        if: steps.compare.outputs.changed == 'true'
        working-directory: artifacts/docs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git init --quiet --initial-branch docs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add manifest.json docs.json.gz
          git commit --quiet -m "docs $(jq -r .version manifest.json)"
          git push --quiet --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" docs
